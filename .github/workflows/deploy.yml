name: Deploy to Seedbox

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: narvi.whatbox.ca
          username: jackbr4
          key: ${{ secrets.SEEDBOX_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/bookshelf-portal

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Setting up backend venv..."
            cd ~/apps/bookshelf-portal/backend
            if ! venv/bin/pip --version >/dev/null 2>&1; then
              echo "  Creating fresh venv (missing or shebangs stale after path change)..."
              rm -rf venv
              python3 -m venv venv
              venv/bin/pip install -r requirements.txt -q
            fi
            cd ~/apps/bookshelf-portal

            echo "Building container..."
            COMMIT=$(git rev-parse HEAD)
            podman build \
              --build-arg CACHE_BUST="$COMMIT" \
              -t bookshelf-request-portal \
              .

            echo "Stopping old container..."
            podman update --restart=no bookshelf-request-portal || true
            OLD_PID=$(podman inspect bookshelf-request-portal --format '{{.State.Pid}}' 2>/dev/null || echo "")
            if [ -n "$OLD_PID" ] && [ "$OLD_PID" != "0" ]; then
              kill -9 $OLD_PID || true
              sleep 2
            fi
            podman rm -f bookshelf-request-portal || true

            echo "Starting new container..."
            podman run -d --name bookshelf-request-portal \
              --restart=always \
              --network=host \
              --env-file ~/apps/bookshelf-portal/.env \
              -v /mnt/mpathw/jackbr4/calibre-web/calibre-web/library:/mnt/mpathw/jackbr4/calibre-web/calibre-web/library:ro \
              -v /home/jackbr4/apps/bookshelf-portal/history.db:/home/jackbr4/apps/bookshelf-portal/history.db \
              bookshelf-request-portal

            echo "Verifying..."
            until curl -sf http://127.0.0.1:8788/health; do sleep 2; done
            echo "Health check passed"

            echo "Running integration tests..."
            cd ~/apps/bookshelf-portal/backend
            venv/bin/pip install pytest --quiet
            APP_PASSWORD=$(grep '^APP_PASSWORD=' ~/apps/bookshelf-portal/.env | cut -d= -f2-)
            APP_PASSWORD="$APP_PASSWORD" venv/bin/pytest tests/test_integration.py -v --tb=short
            echo "Integration tests passed"
